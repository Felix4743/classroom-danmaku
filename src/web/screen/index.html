<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>课堂弹幕 · 投影</title>
    <link rel="stylesheet" href="./screen.css" />
  </head>
  <body>
    <!--
      弹幕层（技术方案 §6 的 src/web/screen/）。它就是投影上那层盖住 PPT 的东西：
      教室电脑全屏打开这个页面，PowerPoint 用「窗口化放映」放在它下面。

      加 `?mode=overlay` 会去掉底色，留给 Electron 的透明窗口用（§4.1 的 L0）。
    -->
    <canvas id="stage"></canvas>

    <!--
      投影上永远不出现学生身份（§4.4 红线）。这个角标只有连接状态和几个
      自己人看的数字，默认隐藏，加 ?diag 才出来 —— 投影的画面上不该有
      「正在重连」之外的任何字。
    -->
    <div id="hud" class="hud" hidden>
      <div><b id="hud-fps">--</b> fps</div>
      <div>同屏 <span id="hud-active">0</span> · 置顶 <span id="hud-pinned">0</span></div>
      <div>轨道 <span id="hud-lanes">0</span> 条 · DPR <span id="hud-dpr">1</span></div>
      <div>丢弃 <span id="hud-dropped">0</span> 条</div>
    </div>

    <div id="status" class="status" hidden>
      <span id="status-text">正在连接…</span>
    </div>

    <script type="module" src="./screen.js"></script>
  </body>
</html>
